[package]
name = "drive"
description = "webdav-drive：本地挂盘工具的 Tauri 2 托盘宿主"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
drive-core = { path = "../../drive-core" }
foundation-core = { workspace = true }
foundation-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.4"

[target.'cfg(windows)'.dependencies]
foundation-windows = { workspace = true }
