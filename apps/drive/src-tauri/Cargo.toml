[package]
name = "drive"
description = "webdav-drive：本地挂盘工具的 Tauri 2 托盘宿主"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri CLI 在正式构建时会启用该 feature。项目的离线打包脚本直接调用
# cargo，因此也必须显式启用它，才能嵌入 frontendDist 而不是访问 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
drive-core = { path = "../../drive-core" }
foundation-core = { workspace = true }
foundation-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# tray-icon 必须显式启用：托盘图标在 setup_tray() 里用代码创建，不依赖 tauri.conf.json 的
# app.trayIcon（那个配置会让 Tauri 自动再建一个托盘图标，出现「两个图标」的 bug）。
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.4"

[target.'cfg(windows)'.dependencies]
foundation-windows = { workspace = true }
